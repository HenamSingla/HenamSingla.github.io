---
layout: page
title: "Portfolio"
permalink: /portfolio/
---

<h1>💼 Portfolio</h1>
<div style="display: flex; flex-wrap: wrap; gap: 20px;">

  {% for item in site.portfolio %}
    <div style="border: 1px solid #ccc; border-radius: 10px; padding: 15px; width: 300px;">
      <h3>{{ item.title }}</h3>
      {% if item.image %}
        <img src="{{ item.image }}" alt="{{ item.title }}" style="width: 100%; height: auto;" />
      {% endif %}
      <p>{{ item.description }}</p>
      {% if item.repo %}
        <a href="{{ item.repo }}" target="_blank">🔗 GitHub</a><br/>
      {% endif %}
      {% if item.demo %}
        <a href="{{ item.demo }}" target="_blank">▶️ Live Demo</a>
      {% endif %}
    </div>
  {% endfor %}

</div>
